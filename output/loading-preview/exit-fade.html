<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교실 캐릭터 등장·퇴장</title><link rel="stylesheet" href="/src/index.css"><style>body{background:#f7f4ee;overflow:hidden}nav{padding:20px;display:flex;gap:16px;align-items:center}button{padding:12px;border:1px solid #ccc;border-radius:10px;background:white}input{width:240px}.student-character-showcase{--student-character-walk-size:160px;--student-character-walk-duration:12s;animation-iteration-count:infinite;animation-play-state:paused;animation-delay:var(--preview-delay,-2.16s);top:160px}.student-character-walk-left{top:360px}.student-character-showcase img{width:100%}</style><nav><button id="play">이동 재생</button><label>이동 진행 <input id="phase" type="range" min="0" max="100" step="1" value="18"></label><output id="value">18%</output></nav><div class="student-character-showcase student-character-walk-right"><img src="/student-characters/character-22-additional.png" alt="오른쪽 퇴장"></div><div class="student-character-showcase student-character-walk-left"><img src="/student-characters/character-7-additional.png" alt="왼쪽 퇴장"></div><script>const nodes=document.querySelectorAll('.student-character-showcase');document.querySelector('#phase').oninput=e=>{nodes.forEach(n=>{n.style.animationPlayState='paused';n.style.setProperty('--preview-delay',`${-12*e.target.value/100}s`)});document.querySelector('#value').textContent=e.target.value+'%'};document.querySelector('#play').onclick=()=>{document.querySelector('#value').textContent='재생 중';nodes.forEach(n=>{n.style.setProperty('--preview-delay','0s');n.style.animationPlayState='running'})};</script></html>
