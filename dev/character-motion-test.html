<body><main><h1>교실 캐릭터 특별 모션 테스트</h1><p>캐릭터를 골라 특별 모션 시안을 확인해요.</p><label for="pick">캐릭터 선택 </label><select id="pick" style="font:inherit;min-height:44px;margin-bottom:16px;padding:8px;border:1px solid #9eb195;border-radius:10px"><option value="character-motion-previews/motion-character-1-transparent.png" data-original="character-1.png" data-right="none" data-left="scaleX(-1)" data-scale="1.228" data-dx="-1.25" data-dy="-7.42">1번 · 호랑이 자캐</option><option value="character-motion-previews/motion-character-1-additional.png" data-original="character-1-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.047" data-dx="-0.25" data-dy="3.37">1번 · 1번 추가 자캐</option><option value="character-motion-previews/motion-character-2-additional-2.png" data-original="character-2-additional-2.png" data-right="none" data-left="none" data-scale="1.091" data-dx="-5.36" data-dy="1.56">2번 · 우주 조종사 자캐</option><option value="character-motion-previews/motion-character-2.png" data-original="character-2.png" data-right="none" data-left="scaleX(-1)" data-scale="1.296" data-dx="-2.78" data-dy="-10.45">2번 · 달리는 자캐</option><option value="character-motion-previews/motion-character-2-additional.png" data-original="character-2-additional.png" data-right="scaleX(-1)" data-left="none" data-scale="1.033" data-dx="0.40" data-dy="0.79">2번 · 2번 추가 자캐</option><option value="character-motion-previews/motion-character-3-transparent.png" data-original="character-3.png" data-right="none" data-left="none" data-scale="1.025" data-dx="1.74" data-dy="0.35">3번 · 자판기 자캐</option><option value="character-motion-previews/motion-character-3-additional.png" data-original="character-3-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.143" data-dx="0.20" data-dy="1.28">3번 · 3번 추가 자캐</option><option value="character-motion-previews/motion-character-4.png" data-original="character-4.png" data-right="rotate(90deg)" data-left="scaleX(-1) rotate(90deg)" data-scale="1.268" data-dx="0.60" data-d -left="none" data-scale="1.059" data-dx="2.23" data-dy="0.78">12번 · 노란 자캐</option><option value="character-motion-previews/motion-character-12-transparent.png" data-original="character-12.png" data-right="none" data-left="none" data-scale="1.152" data-dx="-1.71" data-dy="-2.04">12번 · 클로버 자캐</option><option value="character-motion-previews/motion-character-12-additional-dynamic-v2.png" data-original="character-12-additional.png" data-right="none" data-left="none" data-scale="1.293" data-dx="2.68" data-dy="2.17">12번 · 12번 추가 자캐</option><option value="character-motion-previews/motion-character-13.png" data-original="character-13.png" data-right="none" data-left="none" data-scale="1.184" data-dx="-4.41" data-dy="-1.57">13번 · 지구 로봇 자캐</option><option value="character-motion-previews/motion-character-13-additional-dynamic-v2.png" data-original="character-13-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.349" data-dx="0.23" data-dy="-5.94">13번 · 13번 추가 자캐</option><option value="character-motion-previews/motion-character-13-additional-2.png" data-original="character-13-additional-2.png" data-right="scaleX(-1)" data-left="none" data-scale="1.121" data-dx="-0.24" data-dy="-0.63">13번 · 13번 두 번째 추가 자캐</option><option value="character-motion-previews/motion-character-14-additional.png" data-original="character-14-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.023" data-dx="0.28" data-dy="4.85">14번 · 14번 추가 자캐</option><option value="character-motion-previews/motion-character-15-dynamic-v2.png" data-original="character-15.png" data-right="none" data-left="none" data-scale="1.281" data-dx="-0.54" data-dy="-7.54">15번 · 초록 외계인 자캐</option><option value="character-motion-previews/motion-character-15-additional.png" data-original="character-15-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.037" data-dx="0.59" data-dy="4.21">15번 · 15번 추가 자캐</option><option value="character-motion-previews/motion-character-16.png" data-original="character-16.png" data-right="rotate(90deg)" data-left="scaleX(-1) rotate(90deg)" data-scale="1.184" data-dx="-0.13" data-dy="-0.64">16번 · 메론빵 거북이 자캐</option><option value="character-motion-previews/motion-character-17-additional-dynamic-v2.png" data-original="character-17-additional.png" data-right="scaleX(-1)" data-left="none" data-scale="1.400" data-dx="-2.62" data-dy="-9.12">17번 · 17번 추가 자캐</option><option value="character-motion-previews/motion-character-18.png" data-original="character-18.png" data-right="none" data-left="scaleX(-1)" data-scale="1.128" data-dx="-0.51" data-dy="-1.09">18번 · 고양이 소녀 자캐</option><option value="character-motion-previews/motion-character-18-additional.png" data-original="character-18-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.157" data-dx="-0.21" data-dy="-3.61">18번 · 18번 추가 자캐</option><option value="character-motion-previews/motion-character-19-additional.png" data-original="character-19-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.345" data-dx="0.20" data-dy="-6.01">19번 · 19번 추가 자캐</option><option value="character-motion-previews/motion-character-20.png" data-original="character-20.png" data-right="none" data-left="scaleX(-1)" data-scale="1.254" data-dx="1.44" data-dy="-7.27">20번 · 로켓 자캐</option><option value="character-motion-previews/motion-character-21-dynamic-v2.png" data-original="character-21.png" data-right="none" data-left="none" data-scale="1.173" data-dx="-1.32" data-dy="-0.73">21번 · 별 캡슐 자캐</option><option value="character-motion-previews/motion-character-21-additional.png" data-original="character-21-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="0.949" data-dx="0.25" data-dy="8.91">21번 · 21번 추가 자캐</option><option value="character-motion-previews/motion-character-21-additional-2-dynamic-v2.png" data-original="character-21-additional-2.png" data-right="none" data-left="none" data-scale="1.134" data-dx="-0.26" data-dy="-9.70">21번 · 21번 두 번째 추가 자캐</option><option value="character-motion-previews/motion-character-22-transparent-v2.png" data-original="character-22.png" data-right="scaleX(-1)" data-left="none" data-scale="0.968" data-dx="3.17" data-dy="3.85">22번 · 라옹이 자캐</option><option value="character-motion-previews/motion-character-22-additional-transparent-v2.png" data-original="character-22-additional.png" data-right="scaleX(-1)" data-left="none" data-scale="1.106" data-dx="0.08" data-dy="4.40">22번 · 22번 추가 자캐</option><option value="character-motion-previews/motion-character-23-transparent.png" data-original="character-23.png" data-right="none" data-left="scaleX(-1)" data-scale="1.106" data-dx="0.83" data-dy="-0.07">23번 · 꽃옷 자캐</option><option value="character-motion-previews/motion-character-23-additional.png" data-original="character-23-additional.png" data-right="none" data-left="scaleX(-1)" data-scale="1.100" data-dx="0.48" data-dy="3.20">23번 · 23번 추가 자캐</option></select><div class="controls" style="margin:0 0 16px"><button id="previous" type="button">이전 캐릭터</button><button id="next" type="button">다음 캐릭터</button></div><div class="stage" aria-label="호랑이 캐릭터 모션 미리보기"><div class="character" id="character" role="img" aria-label="호랑이 캐릭터"></div></div><div class="controls"><button id="play" type="button">특별 모션 바로 보기</button><button id="restart" type="button">다시 걷기</button><button id="direction" type="button">방향 바꾸기</button><button id="auto" type="button" aria-pressed="true">5% 자동 판정 켜짐</button></div><div class="status" id="status" role="status" aria-live="polite">걷는 중</div><p class="details">화면을 한 번 지날 때마다 5% 확률로 특별 모션이 나와요. 버튼을 누르면 바로 볼 수 있어요.</p></main>
<script>
const character=document.querySelector('#character'), status=document.querySelector('#status'), autoButton=document.querySelector('#auto');
let position=.5,last=0,mode='walk',motionStart=0,auto=true,chosen=Math.random()<.05,played=false,direction=1;
const pick=document.querySelector('#pick');
function showOriginal(){character.style.backgroundImage=`url('../public/student-characters/${pick.selectedOptions[0].dataset.original}')`;character.style.backgroundSize='contain';character.style.backgroundPosition='center bottom'}
const duration=1200,frames=8;
function showFrame(frame){character.style.backgroundPosition=`${(frame%4)*100/3}% ${Math.floor(frame/4)*100}%`}
function startMotion(now){if(mode==='motion')return;character.style.backgroundImage=`url('./${pick.value}')`;character.style.backgroundSize='400% 200%';mode='motion';motionStart=now;played=true;status.textContent='멈춰서 특별 모션 중';}
function reset(){position=direction===1?-.16:1.16;mode='walk';played=false;chosen=auto&&Math.random()<.05;showOriginal();status.textContent='걷는 중';}
function previewSelected(){position=.5;mode='walk';played=false;chosen=false;showOriginal();character.setAttribute('aria-label',pick.selectedOptions[0].textContent);startMotion(performance.now())}
pick.addEventListener('change',previewSelected);
function stepCharacter(step){pick.selectedIndex=(pick.selectedIndex+step+pick.options.length)%pick.options.length;previewSelected()}
document.querySelector('#previous').addEventListener('click',()=>stepCharacter(-1));
document.querySelector('#next').addEventListener('click',()=>stepCharacter(1));
document.querySelector('#direction').addEventListener('click',()=>{direction*=-1;reset()});
previewSelected();
document.querySelector('#play').addEventListener('click',()=>{if(position<0||position>1)position=.5;if(mode==='motion')mode='walk';startMotion(performance.now())});
document.querySelector('#restart').addEventListener('click',reset);
autoButton.addEventListener('click',()=>{auto=!auto;autoButton.textContent=`5% 자동 판정 ${auto?'켜짐':'꺼짐'}`;autoButton.setAttribute('aria-pressed',String(auto));if(!auto)chosen=false});
function tick(now){const delta=last?Math.min(now-last,100):0;last=now;if(mode==='walk'){position+=direction*delta/14000;if(chosen&&!played&&(direction===1?position>=.5:position<=.5))startMotion(now);if(position>1.16||position<-.16)reset()}else{const progress=(now-motionStart)/duration;if(progress>=1){mode='walk';showOriginal();status.textContent='특별 모션을 마치고 다시 걷는 중'}else showFrame(Math.min(frames-1,Math.floor(progress*frames)))}character.style.left=`${position*100}%`;character.style.transform=`translateX(-50%) ${mode==='walk'?'translateY('+Math.sin(now/180)*3+'px)':''} ${(direction===1?pick.selectedOptions[0].dataset.right:pick.selectedOptions[0].dataset.left).replace('none','')} ${mode==='motion'?`translate(${pick.selectedOptions[0].dataset.dx}%, ${pick.selectedOptions[0].dataset.dy}%) scale(${pick.selectedOptions[0].dataset.scale})`:''}`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
