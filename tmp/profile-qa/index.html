<!doctype html><html lang="ko"><head><meta charset="UTF-8"><title>Profile synchronization QA</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><div id="tools" style="position:fixed;z-index:1000;bottom:0;left:0;background:#fff;padding:6px;font:12px sans-serif"><button id="delay">과거 조회 지연</button> <button id="remote">다른 기기 프로필 변경</button> <button id="remount">다시 입장</button> <a href="#student-store-shop">상점</a> <a href="#student-classword">ㄱㄴㄷ</a> <a href="#student-store-auction">경매</a> <output id="state"></output></div><div id="root"></div><script type="module">
Date.prototype.getDay = () => 5;
const memory = new Map();
Object.defineProperty(window,'localStorage',{value:{getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,String(value)),removeItem:key=>memory.delete(key),clear:()=>memory.clear(),key:index=>[...memory.keys()][index]??null,get length(){return memory.size}}});
const nativeFetch = window.fetch.bind(window);
let row, pendingRelease, holdNext=false, readCount=0, saveCount=0, staleCount=0;
const json = value=>Response.json(structuredClone(value));
window.fetch=async (input,init)=>{
 const url=new URL(typeof input==='string'?input:input.url,location.origin);
 if(!url.pathname.startsWith('/api/')) {
  if(url.origin!==location.origin) throw new Error('External QA fetch forbidden');
  return nativeFetch(input,init);
 }
 if(url.pathname==='/api/shared-settings'){
  if(url.searchParams.has('metadata')) return json({updatedAt:holdNext?'force-read':row.updated_at});
  readCount++;
  const snapshot=structuredClone(row);
  if(holdNext){holdNext=false;await new Promise(resolve=>pendingRelease=resolve);pendingRelease=null;staleCount++;}
  return json(snapshot);
 }
 if(url.pathname==='/api/student-economy'){
  const request=JSON.parse(init.body);saveCount++;
  const result=purchaseStudentProfile(row.value,1,{type:'selected',profileImage:request.action.profileImage},row.value.currencyBalances['1']);
  row.value={...row.value,studentLife:result.studentLife,currencyBalances:result.balances,currencyHistory:result.history};
  row.updated_at=new Date(Date.parse(row.updated_at)+1000).toISOString();
  setTimeout(()=>pendingRelease?.(),800);
  return json({studentLife:result.studentLife,applied:result.applied,profileImage:result.profileImage,profilePrice:result.price,studentEconomy:createStudentEconomyState(),currencyBalanceEntries:result.balances,currencyHistoryEntries:result.history,updatedAt:row.updated_at,message:'QA 프로필 변경 완료'});
 }
 if(url.pathname==='/api/classword' && url.searchParams.has('quiz')) return json({dateKey,question:{id:'qa-quiz',initialHint:'ㄱㅇㅈ',meaning:'가짜 검증 문제',examples:[{register:'written',prefix:'',suffix:''},{register:'spoken',prefix:'',suffix:''}]},completed:false,completedAt:null,rewardAmount:null});
 if(url.pathname==='/api/classword') return json({dateKey,topic:'동물',entries:[{id:'qa-entry',dateKey,initial:'ㄱ',word:'강아지',studentNumber:1,createdAt:row.updated_at,updatedAt:row.updated_at}]});
 return json({});
};
const {default:React}=await import('react');
const {createRoot}=await import('react-dom/client');
const {FAILURE_PROFILE_IMAGES}=await import('/src/lib/failureExhibition.ts');
const {purchaseStudentProfile}=await import('/src/lib/studentProfilePurchase.ts');
const {normalizeStudentLifeState}=await import('/src/lib/studentLife.ts');
const {createStudentEconomyState}=await import('/src/lib/studentEconomy.ts');
const {DEFAULT_AUCTION_ITEMS}=await import('/src/lib/currency.ts');
const {getKoreanDateKey}=await import('/src/lib/classword.ts');
const dateKey=getKoreanDateKey();
row={id:'school-timer-main',scope:'student',updated_at:'2026-09-05T01:00:00.000Z',value:{currencyBalances:{1:2000,2:2000},currencyHistory:{},studentLife:normalizeStudentLifeState({failureProfileAssignments:{1:FAILURE_PROFILE_IMAGES[0],2:FAILURE_PROFILE_IMAGES[1]}}),auctionItems:DEFAULT_AUCTION_ITEMS,auctionBids:{[DEFAULT_AUCTION_ITEMS[0].id]:{amount:20,bidder:1}},auctionAwards:{},studentEconomy:{1:createStudentEconomyState()}}};
await import('/src/index.css');
const {default:AuctionPage}=await import('/src/pages/AuctionPage.tsx');
const root=createRoot(document.querySelector('#root'));
let cycle=0;
const render=()=>root.render(React.createElement(AuctionPage,{studentNumber:1,key:cycle}));
render();
document.querySelector('#delay').onclick=()=>{holdNext=true;window.dispatchEvent(new Event('focus'));};
document.querySelector('#remote').onclick=()=>{const profile= row.value.studentLife.failureProfileAssignments['1']===FAILURE_PROFILE_IMAGES[4]?FAILURE_PROFILE_IMAGES[5]:FAILURE_PROFILE_IMAGES[4];row.value={...row.value,studentLife:normalizeStudentLifeState({...row.value.studentLife,failureProfileAssignments:{...row.value.studentLife.failureProfileAssignments,1:profile}})};row.updated_at=new Date(Date.parse(row.updated_at)+1000).toISOString();};
document.querySelector('#remount').onclick=()=>{cycle++;render()};
setInterval(()=>{document.querySelector('#state').textContent=JSON.stringify({readCount,saveCount,staleCount,held:!!pendingRelease,profile:row.value.studentLife.failureProfileAssignments['1'],cached:JSON.parse(memory.get('school-timer-student-settings-snapshot-v2')??'null')?.value.studentLife.failureProfileAssignments['1']});},100);
</script></body></html>
