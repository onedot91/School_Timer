<!doctype html><html lang="ko"><meta charset="utf-8"><title>책방 실제 조작 영상 검수</title><style>body{background:#f7e6bf;font:18px system-ui;padding:24px}video{width:936px;max-width:100%;image-rendering:pixelated}output{display:block}</style><h1>실제 책방 Canvas 녹화</h1><video src="gameplay.webm" controls muted></video><output></output><script>const video=document.querySelector('video'); const output=document.querySelector('output'); for(const name of ['loadedmetadata','timeupdate','seeked','error']) video.addEventListener(name,()=>{output.textContent=`${video.videoWidth}×${video.videoHeight} · 재생 ${video.currentTime.toFixed(2)}초 · readyState ${video.readyState} · ${video.error?.message ?? '오류 없음'}`;});</script></html>
